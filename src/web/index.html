<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waga</title>
  <link rel="stylesheet" href="/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header>
    <a class="brand" href="/">waga</a>
    <button id="toggle-sessions" aria-expanded="false">세션 목록</button>
    <div id="provider-usage" aria-label="제공자 사용량"></div>
    <span id="connection" role="status">연결 중</span>
    <button id="refresh" aria-label="새로고침">↻</button>
  </header>
  <p id="notice" role="status" hidden></p>
  <main>
    <aside id="session-sidebar" aria-label="프로젝트별 세션">
      <div class="sidebar-heading"><strong>세션</strong><button id="new-session">＋ 새 세션</button></div>
      <input id="session-search" type="search" placeholder="세션 검색" aria-label="세션 검색">
      <div id="session-filters" aria-label="상태 필터"><button data-filter="all" aria-pressed="true">전체</button><button data-filter="needs-input" aria-pressed="false">입력 대기</button><button data-filter="working" aria-pressed="false">작업 중</button></div>
      <nav id="session-list" aria-label="세션 목록"></nav>
      <small class="order-help">드래그로 순서 변경 · Shift+↑↓</small>
    </aside>
    <div class="session-content">
      <div class="session-heading"><div><h1 id="node-title">세션 선택</h1><p id="session-status" class="muted"></p></div><div class="session-actions"><button id="connect-session" disabled>터미널 연결</button><button id="rename-session" disabled>이름 변경</button><button id="archive-session" disabled>보관</button></div></div>
      <div class="view-tabs"><button id="show-conversation" aria-pressed="true">대화</button><button id="show-executions" aria-pressed="false">실행 흐름</button></div>
    <section id="execution-panel" aria-label="실제 실행 기록" hidden>
      <div class="execution-toolbar"><select id="execution-select" aria-label="실행 선택" hidden></select><button id="run-work-view" hidden>작업</button><button id="run-call-view" hidden>호출</button></div>
      <div id="run-controls" hidden><button id="run-pause">일시정지</button><button id="run-resume">재개</button><button id="run-stop">중단</button><button id="run-approve" hidden>최종 검토 완료</button><button id="run-resource-settings">자원 설정</button><span id="run-resource" class="muted"></span></div>
      <p id="execution-note" class="muted" role="status"></p>
      <div class="execution-body"><div id="execution-graph" aria-label="시간순 실행 기록과 호출 관계"></div>
      <div class="execution-inspector" hidden><button id="close-inspector" aria-label="실행 근거 닫기">닫기</button><section id="execution-tools" aria-label="선택한 에이전트의 도구 호출"></section><section id="execution-evidence" aria-label="선택한 호출의 근거"></section></div></div>
    </section>
    <div id="conversation-workspace">
    <section id="detail" aria-label="세션 대화" hidden>
      <div id="messages" class="messages" role="log" aria-label="대화 내역"></div>
      <div id="operation-status" class="operation-status" role="status" hidden></div>
      <section id="session-question" aria-label="승인 요청" hidden><pre id="question-text"></pre><div id="question-choices"></div></section>
      <div id="native-fallback" hidden><p class="muted">세션에서 추가 입력을 기다리고 있습니다.</p><div id="terminal-screen"></div></div>
      <form id="query-form">
        <div id="follow-up-instruction" hidden><span id="follow-up-title"></span><button id="cancel-follow-up" type="button" aria-label="연결 취소">연결 취소</button></div>
        <label for="message">메시지</label><div class="inline composer"><textarea id="message" rows="2" maxlength="16000" placeholder="메시지 입력 · Enter로 보내기, Shift+Enter로 줄바꿈" disabled required></textarea><button id="send" disabled>보내기</button></div>
        <small id="input-status" class="muted" role="status"></small>
      </form>
    </section>
    </div>
    </div>
  </main>
  <dialog id="connect-dialog"><h2>터미널에서 이어가기</h2><p class="muted">아래 명령을 터미널에서 실행하면 이 세션에 연결됩니다.</p><textarea id="connect-command" rows="5" readonly aria-label="터미널 연결 명령"></textarea><div class="actions"><button data-close="connect-dialog">닫기</button><button id="copy-command">명령 복사</button></div></dialog>
  <dialog id="rename-dialog"><form id="rename-form"><h2>세션 이름 변경</h2><label for="session-name">이름</label><input id="session-name" maxlength="200" required><div class="actions"><button type="button" data-close="rename-dialog">취소</button><button>변경</button></div></form></dialog>
  <dialog id="archive-dialog"><form id="archive-form"><h2>세션 보관</h2><p id="archive-name"></p><p class="muted">활성 목록에서 제외합니다. 현재 제공자의 보관 동작을 실행합니다.</p><div class="actions"><button type="button" data-close="archive-dialog">취소</button><button>보관</button></div></form></dialog>
  <dialog id="resource-dialog"><form id="resource-form"><h2>실행 여유 자원</h2><label for="reserve-memory">남겨둘 메모리 (GiB)</label><input id="reserve-memory" type="number" min="4.5" max="128" step="0.5" required><label for="max-cpu">PC CPU 사용률 상한 (%)</label><input id="max-cpu" type="number" min="10" max="90" required><div class="actions"><button type="button" data-close="resource-dialog">취소</button><button>적용</button></div></form></dialog>
  <dialog id="create-dialog"><form id="create-form">
    <h2>새 세션</h2>
    <label for="create-workspace">프로젝트 폴더</label><select id="create-workspace"></select>
    <label for="create-provider">제공자</label><select id="create-provider"><option value="codex">Codex</option><option value="claude">Claude</option></select>
    <label for="create-message">작업 지시</label><textarea id="create-message" rows="5" maxlength="16000" required></textarea>
    <p id="create-cwd" class="muted"></p>
    <div class="actions"><button type="button" data-close="create-dialog">취소</button><button id="create-submit" class="primary">생성</button></div>
  </form></dialog>
</body>
</html>
