<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waga</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <header>
    <a class="brand" href="/">waga</a>
    <button id="show-executions" aria-pressed="true">실행 그래프</button>
    <button id="show-conversation" aria-pressed="false">세션 대화</button>
    <select id="workflow" aria-label="작업 선택"><option value="">작업 선택</option></select>
    <button id="new-workflow">＋ 작업</button>
    <span id="connection" role="status">연결 중</span>
    <button id="refresh" aria-label="새로고침">↻</button>
  </header>
  <p id="notice" role="status" hidden></p>
  <main>
    <section id="execution-panel" aria-label="실제 실행 기록">
      <div class="execution-toolbar"><select id="execution-select" aria-label="실행 선택"></select><button id="import-execution">기록 가져오기</button><button id="run-work-view" hidden>작업</button><button id="run-call-view" hidden>호출</button></div>
      <div id="run-controls" hidden><button id="run-pause">일시정지</button><button id="run-resume">재개</button><button id="run-stop">중단</button><button id="run-approve" hidden>최종 검토 완료</button><button id="run-resource-settings">자원 설정</button><span id="run-resource" class="muted"></span></div>
      <p id="execution-note" class="muted" role="status"></p>
      <div id="execution-graph" aria-label="에이전트 호출 관계"></div>
      <div class="execution-inspector"><section id="execution-tools" aria-label="선택한 에이전트의 도구 호출"></section><section id="execution-evidence" aria-label="선택한 호출의 근거"></section></div>
    </section>
    <div id="conversation-workspace" hidden>
    <section class="canvas" aria-label="작업 그래프">
      <div id="empty" class="empty"><p>등록된 작업이 없습니다.</p><button id="first-workflow">작업 만들기</button></div>
      <div id="graph" class="graph" hidden></div>
    </section>
    <section id="detail" aria-label="세션 대화" hidden>
      <div class="detail-heading"><div><span id="flow-title"></span><h1 id="node-title"></h1></div><button id="edit-evidence">단계 상태·근거</button></div>
      <div class="inline session-picker"><label for="session">담당 세션</label><select id="session"><option value="">세션 연결</option></select><button id="new-session">＋ 세션</button></div>
      <p id="session-status" class="muted"></p>
      <div id="messages" class="messages" role="log" aria-label="대화 내역"></div>
      <div id="operation-status" class="operation-status" role="status" hidden></div>
      <form id="query-form">
        <label for="message">세션에 질의</label>
        <div class="inline composer"><textarea id="message" rows="2" maxlength="16000" placeholder="메시지 입력 · Enter로 보내기, Shift+Enter로 줄바꿈" disabled required></textarea><button id="send" disabled>보내기</button></div>
        <small class="muted">질의는 peer 메시지로 전달됩니다. 권한 승인은 네이티브 화면에서 처리합니다.</small>
      </form>
    </section>
    </div>
  </main>
  <dialog id="resource-dialog"><form id="resource-form"><h2>실행 여유 자원</h2><label for="reserve-memory">남겨둘 메모리 (GiB)</label><input id="reserve-memory" type="number" min="4.5" max="128" step="0.5" required><label for="max-cpu">PC CPU 사용률 상한 (%)</label><input id="max-cpu" type="number" min="10" max="90" required><div class="actions"><button type="button" data-close="resource-dialog">취소</button><button>적용</button></div></form></dialog>
  <dialog id="import-dialog"><form id="import-form">
    <h2>실행 기록 가져오기</h2>
    <label for="trace-file">OpenTelemetry OTLP JSON 파일 · 최대 4MiB</label><input id="trace-file" type="file" accept=".json,application/json" required>
    <label class="content-choice"><input id="trace-content" type="checkbox">도구 입력·출력·diff도 저장</label>
    <p class="muted">내용을 포함하면 코드나 비밀 값이 저장될 수 있습니다. 계정 식별 속성은 제외합니다.</p>
    <div class="actions"><button type="button" data-close="import-dialog">취소</button><button id="import-submit">가져오기</button></div>
  </form></dialog>
      <dialog id="evidence-dialog"><div class="detail-heading"><h2>단계 상태·완료 근거</h2><button type="button" data-close="evidence-dialog" aria-label="닫기">✕</button></div>
        <form id="state-form">
          <label for="phase-state">단계 상태 <small class="muted">직접 기록</small></label>
          <select id="phase-state"><option value="pending">대기</option><option value="active">진행</option><option value="blocked">막힘</option><option value="passed">통과</option></select>
          <label for="phase-note">막힌 이유 / 메모</label><textarea id="phase-note" rows="2" maxlength="2000"></textarea>
          <label for="phase-evidence">완료 근거</label><textarea id="phase-evidence" rows="3" maxlength="4000" placeholder="검증 결과, 리뷰 결론, CI 링크 등"></textarea>
          <label for="commit">검증 대상 Git SHA</label><input id="commit" maxlength="40" placeholder="전체 커밋 SHA (검증·리뷰·통합에 필요)">
          <p id="evidence-commit" class="muted"></p>
          <button type="submit">저장</button>
        </form>
        <form id="rework-form">
          <label for="return-to">되돌릴 단계</label><select id="return-to"></select>
          <label for="return-reason">되돌리는 이유</label><input id="return-reason" maxlength="2000" required>
          <button id="return-submit">되돌리기</button>
        </form>
      </dialog>

  <dialog id="workflow-dialog"><form id="workflow-form">
    <h2>작업 만들기</h2>
    <label for="workflow-title">작업명 / 이슈</label><input id="workflow-title" maxlength="160" required placeholder="예: Keeper #263">
    <div class="actions"><button type="button" data-close="workflow-dialog">취소</button><button class="primary">만들기</button></div>
  </form></dialog>
  <dialog id="create-dialog"><form id="create-form">
    <h2>새 세션</h2>
    <label for="create-provider">제공자</label><select id="create-provider"><option value="claude">Claude</option><option value="codex">Codex</option></select>
    <label for="create-message">작업 지시</label><textarea id="create-message" rows="5" maxlength="16000" required></textarea>
    <p id="create-cwd" class="muted"></p>
    <div class="actions"><button type="button" data-close="create-dialog">취소</button><button id="create-submit" class="primary">생성</button></div>
  </form></dialog>
</body>
</html>
